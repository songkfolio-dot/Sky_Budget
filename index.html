<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Budget Tracker</title>
<style>
:root{--bgc:#f4f8fa;--tx:#10222b;--mu:#4b616b;--card:rgba(255,255,255,.75);--bd:rgba(16,34,43,.16);--ok:#0f766e;--wa:#b45309;--ba:#dc2626;--on:#fff;--bar:#0b1220;--st:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgc:#0b1220;--tx:#e8f0f2;--mu:#a3b6bd;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);--ok:#2dd4bf;--wa:#fbbf24;--ba:#f87171;--on:#06251f}}
:root[data-theme="dark"]{--bgc:#0b1220;--tx:#e8f0f2;--mu:#a3b6bd;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);--ok:#2dd4bf;--wa:#fbbf24;--ba:#f87171;--on:#06251f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:ui-rounded,"SF Pro Rounded",-apple-system,Inter,system-ui,sans-serif;background:radial-gradient(120% 50% at 50% 0%,color-mix(in srgb,var(--st) 32%,transparent) 0%,transparent 62%) fixed,var(--bgc);transition:background .6s}
#app{max-width:520px;margin:0 auto;padding:18px 16px 130px;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.m{color:var(--mu);font-size:13px}
.n{font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.c{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 16px}
.c.on{background:var(--st);color:var(--on);border-color:var(--st);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--st);transition:width .6s}
.pri{border:0;border-radius:28px;background:var(--ok);color:var(--on);font-weight:700;font-size:17px;padding:0 24px;min-height:52px;width:100%}
.dng{color:var(--ba)}
.ring circle{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
h1{margin:0;font-size:26px}h2{margin:6px 0 0;font-size:14px;color:var(--mu);font-weight:600}
label.f{display:block}label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-height:44px}
#tab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;height:64px;border-radius:32px;background:var(--bar);border:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;color:#a3b6bd}
#tab button{background:none;border:0;color:inherit;padding:0 14px}#tab button.on{color:#2dd4bf;font-weight:700}
#plus{position:absolute;left:50%;top:-24px;margin-left:-30px;width:60px;height:60px;border-radius:30px!important;background:var(--ok)!important;color:var(--on)!important;font-size:34px;line-height:1;box-shadow:0 8px 20px rgba(45,212,191,.4);padding:0!important}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet[hidden],#tab[hidden],#toast[hidden]{display:none}
.sh{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--bgc);border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}.ring circle,.bar i,body{transition:none}}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k button{height:54px;border-radius:16px;border:1px solid var(--bd);background:var(--card);font-size:24px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--bar);color:#e8f0f2;border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;z-index:11}
#toast button{background:#2dd4bf;color:#06251f;border:0;border-radius:999px;padding:0 14px;font-weight:700}
.x{padding:10px 0;border-bottom:1px solid var(--bd)}.x:last-child{border:0}
.x button{background:none;border:0;color:var(--mu);min-width:44px}
.em{text-align:center;padding:28px 8px;color:var(--mu)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tab" hidden><button data-a="tab" data-v="home">Home</button><button data-a="tab" data-v="ledger">Ledger</button><button id="plus" data-a="add" aria-label="Add expense">+</button><button data-a="tab" data-v="settings">Settings</button></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
(()=>{
const D=864e5,CAT={Food:'#fbbf24',Transport:'#60a5fa',Fun:'#c084fc',Bills:'#fb7185',Other:'#94a3b8'};
let S=null;try{S=JSON.parse(localStorage.getItem('bt1'))}catch(e){}
const save=()=>{try{localStorage.setItem('bt1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T='home',Q=null,U=null,F='',tt;
const sym=()=>S?S.sym:'$';
const m=c=>(c<0?'-':'')+sym()+(Math.abs(c)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pm=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?Math.round(n*100):0};
const ds=t=>{const d=new Date(t);return +new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const addD=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return +d};
const pl=()=>S.mode=='period'?'Period':'Month';
const MB=()=>(S.mode=='period'?'Period':'Monthly')+' budget exceeded';
const fd=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const pd=v=>{if(!v)return 0;const p=v.split('-').map(Number);return +new Date(p[0],p[1]-1,p[2])};
const di=t=>{if(!t)return'';const d=new Date(t),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const endMs=()=>S&&S.end?ds(S.end)+D-1:0;
const cur=()=>{const n=Date.now(),e=endMs();return e&&n>e?e:n};
const wk=t=>addD(ds(t),-((new Date(t).getDay()-S.fw+7)%7));
const dim=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const calc=(mo,ty,w,days)=>ty==2?w:ty==1?Math.round(mo*7/days):Math.floor(mo/4);
const rev=t=>{let r=S.r[0];for(const q of S.r)if(q.f<=t)r=q;return r};
const base=ws=>{const r=rev(ws);return calc(r.m,r.t,r.w,dim(ws))};
// ---- engine: everything is derived from the expense list ----
function weeks(upto){if(S.mode=='period')return weeksP(upto);upto=endMs()?Math.min(upto,endMs()):upto;const by={},st=ds(S.start),en=endMs();for(const e of S.x)if(e.d>=st&&!(en&&e.d>en)){const k=wk(e.d);by[k]=(by[k]||0)+e.a}
 const o=[];let c=S.c0,w=wk(S.start);const last=Math.max(w,wk(upto));
 while(w<=last){const b=base(w),av=b-c,sp=by[w]||0,f=S.fg.includes(w),co=f?0:Math.max(0,sp-av);o.push({w,b,ci:c,av,sp,rem:av-sp,co});c=co;w=addD(w,7)}return o}
function month(t){if(S.mode=='period'){const st=ds(S.start),en=endMs(),sp=S.x.filter(x=>x.d>=st&&x.d<=en).reduce((a,x)=>a+x.a,0);return{b:S.total,sp,rem:S.total-sp}}
 const d=new Date(t),s=+new Date(d.getFullYear(),d.getMonth(),1),e=+new Date(d.getFullYear(),d.getMonth()+1,1),b=rev(e-1).m;
 const sp=S.x.filter(x=>x.d>=Math.max(s,ds(S.start))&&x.d<e&&!(endMs()&&x.d>endMs())).reduce((a,x)=>a+x.a,0);return{b,sp,rem:b-sp}}
const stat=(sp,av)=>sp>av?'over':(av<=0||sp*100>=av*80)?'warn':'ok';
const col=s=>s=='over'?'var(--ba)':s=='warn'?'var(--wa)':'var(--ok)';
function weeksP(upto){const st=ds(S.start),days=Math.round((ds(S.end)-st)/D)+1,n=Math.ceil(days/7),by=[];
 for(const e of S.x){const dd=Math.round((ds(e.d)-st)/D);if(dd>=0&&dd<days){const i=Math.floor(dd/7);by[i]=(by[i]||0)+e.a}}
 const last=Math.min(n-1,Math.max(0,Math.floor(Math.round((ds(upto)-st)/D)/7))),o=[];let c=S.c0||0;
 for(let i=0;i<=last;i++){const e1=Math.min(days,7*(i+1)),b=Math.round(S.total*e1/days)-Math.round(S.total*7*i/days),av=b-c,sp=by[i]||0,ws=addD(st,7*i),co=S.fg.includes(ws)?0:Math.max(0,sp-av);o.push({w:ws,i,n,len:e1-7*i,b,ci:c,av,sp,rem:av-sp,co});c=co}
 return o}
function pace(w,now){const L=w.len||7,e=Math.min(L,Math.max(1,Math.round((ds(now)-w.w)/D)+1)),left=L-e+1,exp=Math.floor(Math.max(0,w.av)*e/L);
 return{e,left,safe:Math.floor(Math.max(0,w.rem)/left),delta:exp-w.sp,proj:w.sp+Math.floor(w.sp*(L-e)/e)}}
const ring=(p,size,sw,c)=>{const r=(size-sw)/2,C=2*Math.PI*r;p=Math.max(0,Math.min(1,p));return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)} percent left"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`};
// ---- views ----
function form(v){const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 return`<label class="f"><span class="m">Budget type</span><select id="fmode"><option value="month"${v.k!='period'?' selected':''}>Monthly (repeats every month)</option><option value="period"${v.k=='period'?' selected':''}>Fixed period (start date to end date)</option></select></label>
<label class="f"><span class="m" id="fml">Monthly budget</span><input id="fm" inputmode="decimal" value="${v.m}" placeholder="140"></label>
<div class="mo" style="display:flex;flex-direction:column;gap:12px"><label class="f"><span class="m">Weekly budget method</span><select id="ft"><option value="0"${v.t==0?' selected':''}>Monthly ÷ 4</option><option value="1"${v.t==1?' selected':''}>Monthly × 7 ÷ days in month</option><option value="2"${v.t==2?' selected':''}>Manual weekly amount</option></select></label>
<label class="f"><span class="m">Manual weekly amount</span><input id="fw" inputmode="decimal" value="${v.w}"></label></div>
<div class="g m" id="pv"></div>
<label class="f mo"><span class="m">First day of the week</span><select id="fd">${days.map((d,i)=>`<option value="${i}"${v.d==i?' selected':''}>${d}</option>`).join('')}</select></label>
<label class="f"><span class="m">Start date</span><input id="fsd" type="date" value="${v.sd}"></label>
<label class="f"><span class="m">End date <span id="fe">(optional)</span></span><input id="fed" type="date" value="${v.ed}"></label>
<label class="f"><span class="m">Currency symbol</span><input id="fs" value="${esc(v.s)}" maxlength="4"></label>`}
function prev(){const e=$('#pv');if(!e)return;const per=$('#fmode').value=='period',mo=pm($('#fm').value),s=$('#fs').value||'$';
 document.querySelectorAll('.mo').forEach(x=>x.style.display=per?'none':(x.tagName=='DIV'?'flex':'block'));
 $('#fml').textContent=per?'Total budget for the whole period':'Monthly budget';$('#fe').textContent=per?'(required)':'(optional)';
 if(per){const sd=pd($('#fsd').value)||ds(Date.now()),ed=pd($('#fed').value);
  if(!ed){e.textContent='Pick an end date to see your weekly budget.';return}
  if(ed<sd){e.textContent='The end date must be after the start date.';return}
  const days=Math.round((ed-sd)/D)+1,n=Math.ceil(days/7);
  e.textContent=`${s}${(mo/100).toFixed(2)} over ${days} days (${n} week${n==1?'':'s'}) → Weekly ${s}${(Math.round(mo*7/days)/100).toFixed(2)}`+(days%7?' · last week is shorter':'');return}
 const t=+$('#ft').value,w=calc(mo,t,pm($('#fw').value),dim(Date.now()));e.textContent=`Monthly ${s}${(mo/100).toFixed(2)} → Weekly ${s}${(w/100).toFixed(2)}`}
function setup(){return`<h1>Welcome</h1><h2>Set up your budget. You can change it any time in Settings.</h2><div class="g" style="display:flex;flex-direction:column;gap:12px">${form({k:'month',m:'',t:0,w:'',d:1,s:'$',sd:di(Date.now()),ed:''})}<button class="pri" data-a="start">Start tracking</button></div><p class="m">Your data stays on this device. Nothing is sent anywhere.</p>`}
function home(){const now=cur(),W=weeks(now),w=W[W.length-1],M=month(now),s=stat(w.sp,w.av),ms=stat(M.sp,M.b),P=pace(w,now);
 document.documentElement.style.setProperty('--st',col(s));
 const per=S.mode=='period',lastW=per&&w.i>=w.n-1,nx=per&&!lastW?weeks(addD(w.w,7)).pop():null,nb=per?(nx?nx.b:0):base(addD(w.w,7)),na=per?(nx?nx.av:0):nb-w.co,pdays=per?Math.round((ds(S.end)-ds(S.start))/D)+1:0,pidx=per?Math.round((ds(now)-ds(S.start))/D):0,pleft=Math.max(0,Math.min(pdays,pdays-pidx)),today=S.x.filter(x=>ds(x.d)==ds(now)).sort((a,b)=>b.d-a.d);
 const line=P.delta>=0?`You’re ${m(P.delta)} under pace`:`You’re ${m(-P.delta)} over pace`;
 const ended=endMs()&&Date.now()>endMs();return`<h1>Budget Tracker</h1>${ended?`<div class="g" style="border-color:var(--wa)"><b>Tracking ended on ${new Date(S.end).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</b><div class="m">Showing your final week. Change the end date in Settings to keep going.</div></div>`:''}<h2>${per?`Week ${w.i+1} of ${w.n} · `:'Week of '}${fd(w.w)}${per?' – '+fd(addD(w.w,w.len-1)):''}</h2>
<div class="g row"><div style="position:relative;width:150px;height:150px;flex:none">${ring(w.av>0?w.rem/w.av:0,150,13,col(s))}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="n" style="font-size:24px;color:${col(s)}">${m(w.rem)}</div><div class="m">left this week</div></div></div>
<div><div class="m">Safe to spend today</div><div class="n" style="font-size:26px">${m(P.safe)}</div><div style="font-size:14px">${line}</div><div class="m">${m(w.sp)} of ${m(w.av)} spent</div></div></div>
<div class="row"><div class="g row" style="flex:1;padding:12px">${ring(M.b>0?M.rem/M.b:0,56,7,col(ms))}<div><div class="n" style="color:${col(ms)}">${m(M.rem)}</div><div class="m">${per?'period':'month'} left</div></div></div>
<div class="g" style="flex:1;padding:12px"><div class="m">Next week plan</div><div class="n" style="font-size:18px;color:${na<0?'var(--ba)':'inherit'}">${lastW?'Final week':m(na)}</div><div class="bar"><i style="width:${nb>0?Math.max(0,Math.min(100,na/nb*100)):0}%"></i></div></div></div>
${per?`<div class="g row sp"><div><b>Budget ${m(S.total)}</b><div class="m">${pidx<0?'Starts on '+fd(S.start):m(M.rem)+' left · '+pleft+' day'+(pleft==1?'':'s')+' to go'}</div></div><span class="c m">${fd(S.start)} – ${fd(S.end)}</span></div>`:''}<div class="g row sp"><div><b>${s=='over'?'Weekly budget exceeded':ms=='over'?MB():s=='warn'?'Close to your limit':'On track'}</b><div class="m">Projected ${m(P.proj)} by week end</div></div>${w.ci>0?`<button class="c dng" data-a="forgive">Carryover ${m(w.ci)} · Forgive</button>`:`<span class="c m">No carryover</span>`}</div>
<h2>Today</h2><div class="g" style="padding:4px 16px">${today.length?today.map(row).join(''):'<div class="em">Nothing logged today.<br>Tap + to add your first expense.</div>'}</div>`}
const row=x=>`<div class="x row sp"><div><span style="color:${CAT[x.c]||CAT.Other}">●</span> ${esc(x.n)} <span class="m">${esc(x.c)}</span></div><div class="row"><span class="n">${m(x.a)}</span><button data-a="del" data-v="${x.id}" aria-label="Delete expense">✕</button></div></div>`;
function list(){const q=F.toLowerCase(),xs=S.x.filter(x=>!q||(x.n+' '+x.c).toLowerCase().includes(q)).sort((a,b)=>b.d-a.d);
 if(!xs.length)return'<div class="em">No expenses to show yet.<br>Tap + to log one.</div>';
 const tot={};xs.forEach(x=>tot[ds(x.d)]=(tot[ds(x.d)]||0)+x.a);let h='',cur=0;
 for(const x of xs){const k=ds(x.d);if(k!=cur){cur=k;h+=`<div class="row sp m" style="padding:12px 0 2px"><b>${new Date(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</b><b>${m(tot[k])}</b></div>`}h+=row(x)}
 return`<div class="g" style="padding:4px 16px">${h}</div>`}
const ledger=()=>`<h1>Ledger</h1><input id="q" type="search" placeholder="Search notes or categories" value="${esc(F)}"><div id="ll">${list()}</div>`;
function settings(){const r=rev(Date.now());return`<h1>Settings</h1><div class="g" style="display:flex;flex-direction:column;gap:12px">${form({k:S.mode||'month',m:((S.mode=='period'?S.total:r.m)/100).toFixed(2),t:r.t,w:(r.w/100).toFixed(2),d:S.fw,s:S.sym,sd:di(S.start),ed:di(S.end)})}<p class="m" style="margin:0">You’ll be asked to confirm before anything changes.</p><button class="pri" data-a="apply">Apply changes</button></div>
<div class="g" style="display:flex;flex-direction:column;gap:10px"><label class="f"><span class="m">Appearance</span><select id="th"><option value="dark"${S.th=='dark'?' selected':''}>Dark</option><option value="light"${S.th=='light'?' selected':''}>Light</option><option value="auto"${S.th=='auto'?' selected':''}>Match device</option></select></label>
<label class="f"><span class="m">When the app opens</span><select id="oa"><option value="1"${S.oa!==false?' selected':''}>Add Expense screen</option><option value="0"${S.oa===false?' selected':''}>Home</option></select></label>
<span class="m">Backup</span><textarea id="bk" rows="3" placeholder="Paste a backup here to restore"></textarea><div class="row"><button class="c" data-a="copy">Copy backup</button><button class="c" data-a="restore">Restore</button></div></div>
<button class="c dng" data-a="reset">Reset all data</button>`}
function sheet(){if(!Q)return'';
 if(Q.done){const d=Q.done,b=d.mo.rem<0?[MB(),'var(--ba)']:d.w.rem<0?['Weekly budget exceeded','var(--ba)']:['Within budget','var(--ok)'];
  return`<div class="sh"><div class="g"><div class="m">Saved</div><div class="n" style="font-size:30px">${m(d.e.a)} <span class="m">${esc(d.e.n)}</span></div><div class="c" style="display:inline-block;color:${b[1]};margin:8px 0">${b[0]}</div>
<div class="row sp x"><span class="m">Week available</span><b class="n">${m(d.w.av)}</b></div><div class="row sp x"><span class="m">Week spent</span><b class="n">${m(d.w.sp)}</b></div><div class="row sp x"><span class="m">Week remaining</span><b class="n" style="color:${d.w.rem<0?'var(--ba)':'inherit'}">${m(d.w.rem)}</b></div><div class="row sp x"><span class="m">${pl()} spent</span><b class="n">${m(d.mo.sp)}</b></div><div class="row sp x"><span class="m">${pl()} remaining</span><b class="n" style="color:${d.mo.rem<0?'var(--ba)':'inherit'}">${m(d.mo.rem)}</b></div></div>
<button class="pri" data-a="close">Done</button><button class="c" data-a="undoSave">Undo this expense</button></div>`}
 const dt=new Date(Q.when||Date.now()),pad=n=>String(n).padStart(2,'0'),loc=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
 return`<div class="sh"><div class="row sp"><b style="font-size:18px">New expense</b><button class="c" data-a="close" aria-label="Close">✕</button></div>
<div style="text-align:center"><div class="n" style="font-size:56px" id="amt">${sym()}${Q.amt||'0'}</div></div>
<div class="row" style="flex-wrap:wrap;gap:8px">${Object.keys(CAT).map(k=>`<button class="c${Q.cat==k?' on':''}" data-a="cat" data-v="${k}">${k}</button>`).join('')}</div>
<input id="note" placeholder="Note (optional) — blank saves as Unspecified expense" value="${esc(Q.note||'')}"><input id="when" type="datetime-local" value="${loc}" aria-label="Date and time">
<div class="row" style="gap:8px">${[1,2,5,10].map(n=>`<button class="c" data-a="chip" data-v="${n}">+${n}</button>`).join('')}<button class="c" data-a="repeat" style="flex:1">Repeat last</button></div>
<div class="k">${'123456789.0⌫'.split('').map(k=>`<button data-a="key" data-v="${k}"${k=='⌫'?' aria-label="Delete"':''}>${k}</button>`).join('')}</div><button class="pri" data-a="save">Save expense</button></div>`}
function render(){const a=$('#app');if(!S){a.innerHTML=setup();$('#tab').hidden=true;prev();return}
 $('#tab').hidden=false;const th=S.th||'dark';th=='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=th;
 if(T!='home')document.documentElement.style.setProperty('--st','var(--ok)');
 a.innerHTML=T=='home'?home():T=='ledger'?ledger():settings();prev();
 document.querySelectorAll('#tab button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==T));
 const s=$('#sheet');s.hidden=!Q;s.innerHTML=sheet()}
const sync=()=>{if(Q&&!Q.done){const n=$('#note'),w=$('#when');if(n)Q.note=n.value;if(w&&w.value)Q.when=new Date(w.value).getTime()}};
function toast(t,undo){const e=$('#toast');e.innerHTML=`<span>${t}</span>${undo?'<button data-a="undo">Undo</button>':''}`;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},5000)}
function ask(t,ok){Q=null;const s=$('#sheet');s.hidden=false;s.innerHTML=`<div class="sh"><div class="g">${t}</div><button class="pri" data-a="yes">Confirm</button><button class="c" data-a="no">Cancel</button></div>`;ask.ok=ok}
const act={
tab(v){T=v;render();scrollTo(0,0)},
add(){Q={amt:'',cat:'Food'};render()},close(){Q=null;render()},no(){Q=null;render()},yes(){const f=ask.ok;Q=null;render();f&&f()},
key(k){sync();let a=Q.amt;if(k=='⌫')a=a.slice(0,-1);else if(k=='.'){if(!a.includes('.'))a=(a||'0')+'.'}else if(!(a.includes('.')&&a.split('.')[1].length>=2)&&a.length<9)a=a=='0'?k:a+k;Q.amt=a;$('#amt').textContent=sym()+(a||'0')},
chip(n){sync();Q.amt=String(+((parseFloat(Q.amt||0)+ +n).toFixed(2)));render()},
cat(v){sync();Q.cat=v;render()},
repeat(){sync();const l=S.x.slice().sort((a,b)=>b.t-a.t)[0];if(l){Q.amt=(l.a/100).toFixed(2).replace(/\.00$/,'');Q.cat=l.c;Q.note=l.n==='Unspecified expense'?'':l.n;render()}},
save(){sync();const a=pm(Q.amt);if(a<=0){$('#amt').style.color='var(--ba)';return}
 const e={id:String(Date.now())+Math.random().toString(36).slice(2,6),a,d:Q.when||Date.now(),t:Date.now(),c:Q.cat,n:(Q.note||'').trim()||'Unspecified expense'};S.x.push(e);save();if(e.d<ds(S.start)||(endMs()&&e.d>endMs()))toast('Saved, but this date is outside your start and end dates, so it isn’t counted.');
 const W=weeks(e.d),w=W[W.length-1];Q={done:{e,w,mo:month(e.d)}};render()},
undoSave(){S.x=S.x.filter(x=>x.id!=Q.done.e.id);save();Q=null;render()},
del(id){const e=S.x.find(x=>x.id==id);S.x=S.x.filter(x=>x.id!=id);U=e;save();render();toast('Deleted. Totals updated.',1)},
undo(){if(U){S.x.push(U);U=null;save();$('#toast').hidden=true;render()}},
forgive(){ask('Forgive the carryover from last week? This week’s available budget goes back to the full base. This can’t be undone.',()=>{const w=weeks(Date.now()).pop();S.fg.push(addD(w.w,-7));save();render()})},
start(){const mo=pm($('#fm').value);if(mo<=0){$('#fm').focus();return}
 const per=$('#fmode').value=='period',sd=pd($('#fsd').value)||ds(Date.now()),ed=pd($('#fed').value);
 if(per&&!ed){toast('Pick an end date for a fixed period');return}
 if(ed&&ed<sd){toast('End date must be after the start date');return}
 S={sym:$('#fs').value||'$',fw:+$('#fd').value,start:sd,end:ed,mode:per?'period':'month',total:per?mo:0,c0:0,th:'dark',r:[],x:[],fg:[]};
 S.r=[{f:wk(S.start),m:mo,t:+$('#ft').value,w:pm($('#fw').value)}];save();T='home';render()},
apply(){const mo=pm($('#fm').value),per=$('#fmode').value=='period',t=+$('#ft').value,w=pm($('#fw').value),s=$('#fs').value||'$',d=+$('#fd').value,sd=pd($('#fsd').value)||S.start,ed=pd($('#fed').value);if(mo<=0)return;
 if(per&&!ed){toast('Pick an end date for a fixed period');return}
 if(ed&&ed<sd){toast('End date must be after the start date');return}
 ask(`Apply these settings?${per?' The total budget is spread across every week from the start date to the end date, so changing it recalculates all weeks in the period.':' Changes apply from this week onward. Past weeks and months keep their results.'}${!per&&d!=S.fw?'<br><br>Changing the first day of the week regroups past weeks.':''}${ds(sd)!=ds(S.start)?'<br><br>Changing the start date changes which expenses are counted.':''}`,()=>{
  const chg=(per?'period':'month')!=(S.mode||'month')||ds(sd)!=ds(S.start);if(chg)S.fg=[];
  S.sym=s;S.fw=d;S.start=sd;S.end=ed;S.mode=per?'period':'month';
  if(per)S.total=mo;else{const f=wk(Date.now());S.r=S.r.filter(r=>r.f!=f);S.r.push({f,m:mo,t,w});S.r.sort((a,b)=>a.f-b.f)}
  save();render();toast('Settings updated')})},
copy(){const j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(()=>toast('Backup copied'))}catch(e){}const b=$('#bk');b.value=j;b.select()},
restore(){try{const j=JSON.parse($('#bk').value);if(!j||!j.r||!j.x)throw 0;ask('Replace all current data with this backup?',()=>{S=j;save();render()})}catch(e){toast('That isn’t a valid backup')}},
reset(){ask('Erase all expenses and settings on this device? This can’t be undone.',()=>{S=null;try{localStorage.removeItem('bt1')}catch(e){}render()})}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id=='q'){F=e.target.value;$('#ll').innerHTML=list()}else if(/^f(m|t|w|s|mode|sd|ed)$/.test(e.target.id))prev()});
document.addEventListener('change',e=>{if(e.target.id=='oa'){S.oa=e.target.value=='1';save()}else if(e.target.id=='th'){S.th=e.target.value;save();render()}else if(/^f(m|t|w|s|mode|sd|ed)$/.test(e.target.id))prev()});
render();
if(S&&S.oa!==false)act.add();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
